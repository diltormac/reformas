<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <title>OS Fácil — Painel de Reformas (Cockpit)</title>

    <!-- Tailwind e SweetAlert2 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SDK do Capacitor e Plugin da Câmera -->
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/core@5.0.0/dist/capacitor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/camera@5.0.0/dist/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/camera@5.0.0/dist/web.js"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              darkbase: "#06080f",
              panel: "#0e1320",
              panelborder: "#1a233a",
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #06080f;
        color: #cbd5e1;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(3, 5, 10, 0.95);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .lightbox.active {
        display: flex;
        opacity: 1;
      }
      .lightbox img {
        max-width: 96%;
        max-height: 92vh;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        border: 1px solid #1e293b;
      }

      /* ====== CARD DE CADA RODA ====== */
      .roda-card {
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.02),
          0 4px 14px rgba(0, 0, 0, 0.35);
        transition: all 0.2s ease;
      }
      .roda-card:hover {
        transform: translateY(-1px);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.02),
          0 8px 22px rgba(0, 0, 0, 0.5);
      }

      /* ====== MINIATURA RESPONSIVA ====== */
      .thumb-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f1a;
        cursor: pointer;
      }
      .thumb-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }
      .thumb-wrap:hover img {
        transform: scale(1.06);
      }

      /* ====== NÚMERO DA OS EM DESTAQUE ====== */
      .os-numero {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      /* ====== STATS CARDS ====== */
      .stat-card {
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }
      .stat-card:hover {
        transform: translateY(-1px);
      }

      /* ====== MOBILE ====== */
      @media (max-width: 640px) {
        .roda-card .thumb-wrap {
          height: 160px; /* Foto um pouco menor no mobile */
        }
        .os-numero {
          font-size: 1.15rem;
        }
        /* Deixa os stats em linha rolável */
        .stats-scroll {
          display: flex;
          overflow-x: auto;
          gap: 8px;
          padding-bottom: 4px;
          scrollbar-width: none; /* Firefox */
        }
        .stats-scroll::-webkit-scrollbar {
          display: none; /* Chrome/Safari */
        }
        .stats-scroll > div {
          flex: 0 0 auto;
          min-width: 130px;
        }
      }
    </style>

    <link rel="manifest" href="./manifest.json" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <meta name="theme-color" content="#06080f" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="h-screen flex flex-col overflow-hidden">
    <!-- TOPO / HEADER (Compacto) -->
    <header
      class="bg-panel border-b border-panelborder px-3 sm:px-5 py-2 sm:py-3 flex items-center justify-between flex-shrink-0 z-20"
    >
      <div class="flex items-center gap-2 sm:gap-3">
        <div
          class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-blue-500 animate-pulse"
        ></div>
        <h1
          class="font-bold text-[10px] sm:text-xs uppercase tracking-widest text-slate-200 mono"
        >
          OS Fácil
          <span class="text-blue-400 font-normal hidden sm:inline">//</span>
          <span class="hidden sm:inline"> Controle de Reformas</span>
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button
          onclick="window.location.href = 'index.html'"
          class="text-[10px] sm:text-xs mono bg-panelborder hover:bg-slate-800 text-slate-300 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded transition border border-slate-800 flex items-center gap-1.5"
        >
          <i class="fa-solid fa-arrow-left text-blue-400"></i>
          <span class="hidden sm:inline">Painel Geral</span
          ><span class="sm:hidden">Voltar</span>
        </button>
      </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main
      class="flex-1 flex flex-col overflow-hidden p-3 sm:p-4 gap-2 sm:gap-3 max-w-[1600px] w-full mx-auto"
    >
      <!-- STATS CARDS (Rolável no mobile) -->
      <div
        class="stats-scroll grid grid-cols-2 sm:grid-cols-4 sm:gap-3 flex-shrink-0"
      >
        <div
          class="stat-card bg-panel border border-panelborder rounded-lg p-2.5 sm:p-3 flex items-center gap-2 sm:gap-3"
        >
          <div
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-slate-500/10 border border-slate-500/20 flex items-center justify-center flex-shrink-0"
          >
            <i
              class="fa-solid fa-layer-group text-slate-300 text-sm sm:text-base"
            ></i>
          </div>
          <div class="min-w-0">
            <p
              class="text-[9px] sm:text-[10px] mono text-slate-500 uppercase tracking-wider leading-none"
            >
              Total
            </p>
            <p
              id="statTotal"
              class="text-lg sm:text-xl font-bold text-white mono leading-none mt-1"
            >
              0
            </p>
          </div>
        </div>

        <div
          class="stat-card bg-panel border border-amber-500/30 rounded-lg p-2.5 sm:p-3 flex items-center gap-2 sm:gap-3"
        >
          <div
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center flex-shrink-0"
          >
            <i class="fa-solid fa-gear text-amber-400 text-sm sm:text-base"></i>
          </div>
          <div class="min-w-0">
            <p
              class="text-[9px] sm:text-[10px] mono text-amber-500/80 uppercase tracking-wider leading-none"
            >
              Em Produção
            </p>
            <p
              id="statProducao"
              class="text-lg sm:text-xl font-bold text-amber-400 mono leading-none mt-1"
            >
              0
            </p>
          </div>
        </div>

        <div
          class="stat-card bg-panel border border-blue-500/30 rounded-lg p-2.5 sm:p-3 flex items-center gap-2 sm:gap-3"
        >
          <div
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center flex-shrink-0"
          >
            <i
              class="fa-solid fa-box-open text-blue-400 text-sm sm:text-base"
            ></i>
          </div>
          <div class="min-w-0">
            <p
              class="text-[9px] sm:text-[10px] mono text-blue-500/80 uppercase tracking-wider leading-none"
            >
              Prontas
            </p>
            <p
              id="statProntas"
              class="text-lg sm:text-xl font-bold text-blue-400 mono leading-none mt-1"
            >
              0
            </p>
          </div>
        </div>

        <div
          class="stat-card bg-panel border border-emerald-500/30 rounded-lg p-2.5 sm:p-3 flex items-center gap-2 sm:gap-3"
        >
          <div
            class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center flex-shrink-0"
          >
            <i
              class="fa-solid fa-circle-check text-emerald-400 text-sm sm:text-base"
            ></i>
          </div>
          <div class="min-w-0">
            <p
              class="text-[9px] sm:text-[10px] mono text-emerald-500/80 uppercase tracking-wider leading-none"
            >
              Retiradas
            </p>
            <p
              id="statRetiradas"
              class="text-lg sm:text-xl font-bold text-emerald-400 mono leading-none mt-1"
            >
              0
            </p>
          </div>
        </div>
      </div>

      <!-- BARRA DE FILTROS E BUSCA -->
      <div
        class="bg-panel p-2 sm:p-3 rounded border border-panelborder flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-3 flex-shrink-0"
      >
        <div
          class="flex items-center gap-2 w-full sm:w-80 bg-darkbase px-2.5 py-1.5 rounded border border-panelborder focus-within:border-blue-500 transition"
        >
          <i
            class="fa-solid fa-magnifying-glass text-slate-500 text-[10px] sm:text-xs"
          ></i>
          <input
            id="inputBusca"
            type="text"
            placeholder="Filtrar por OS, cliente..."
            class="w-full bg-transparent border-none outline-none text-[11px] sm:text-xs text-white placeholder:text-slate-600 mono"
          />
        </div>

        <div
          class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 scrollbar-hide"
        >
          <button
            onclick="definirFiltro('todas')"
            id="btnFiltroTodas"
            class="px-2.5 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-xs mono font-semibold rounded bg-blue-600 text-white transition whitespace-nowrap"
          >
            Todas
          </button>
          <button
            onclick="definirFiltro('producao')"
            id="btnFiltroProducao"
            class="px-2.5 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-xs mono font-semibold rounded bg-darkbase hover:bg-slate-800 text-slate-400 border border-panelborder transition whitespace-nowrap"
          >
            Em Produção
          </button>
          <button
            onclick="definirFiltro('prontas')"
            id="btnFiltroProntas"
            class="px-2.5 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-xs mono font-semibold rounded bg-darkbase hover:bg-slate-800 text-slate-400 border border-panelborder transition whitespace-nowrap"
          >
            Prontas
          </button>
          <button
            onclick="definirFiltro('retiradas')"
            id="btnFiltroRetiradas"
            class="px-2.5 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-xs mono font-semibold rounded bg-darkbase hover:bg-slate-800 text-slate-400 border border-panelborder transition whitespace-nowrap"
          >
            Retiradas
          </button>
        </div>
      </div>

      <!-- LISTA DE RODAS (CARDS) -->
      <div
        id="listaReformas"
        class="flex-1 overflow-y-auto space-y-2 sm:space-y-3 pr-1 pb-2"
      >
        <div
          class="flex flex-col items-center justify-center py-16 text-slate-500 mono"
        >
          <i
            class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-500 mb-3 block"
          ></i>
          <span class="text-xs">Carregando registros do servidor...</span>
        </div>
      </div>
    </main>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="lightbox" onclick="fecharLightbox(event)">
      <button
        onclick="fecharLightbox(event)"
        class="absolute top-5 right-5 w-9 h-9 bg-panel border border-panelborder text-slate-300 rounded flex items-center justify-center hover:bg-slate-800 transition"
      >
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
      <button
        onclick="navegarLightbox(event, -1)"
        id="btnPrev"
        class="absolute left-5 top-1/2 -translate-y-1/2 w-10 h-10 bg-panel border border-panelborder text-slate-300 rounded flex items-center justify-center hover:bg-slate-800 transition"
      >
        <i class="fa-solid fa-chevron-left text-sm"></i>
      </button>
      <img
        id="lightboxImg"
        src=""
        alt="Ampliação"
        onclick="event.stopPropagation()"
      />
      <button
        onclick="navegarLightbox(event, 1)"
        id="btnNext"
        class="absolute right-5 top-1/2 -translate-y-1/2 w-10 h-10 bg-panel border border-panelborder text-slate-300 rounded flex items-center justify-center hover:bg-slate-800 transition"
      >
        <i class="fa-solid fa-chevron-right text-sm"></i>
      </button>
      <div
        id="lightboxCounter"
        class="absolute bottom-5 left-1/2 -translate-x-1/2 text-slate-300 mono bg-panel border border-panelborder px-3.5 py-1 rounded text-xs"
      >
        1 / 1
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/reforma.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
