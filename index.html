<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <title>OS Fácil — Painel de Reformas (Cockpit)</title>

    <!-- Tailwind e SweetAlert2 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- SDK do Capacitor e Plugin da Câmera -->
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/core@5.0.0/dist/capacitor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/camera@5.0.0/dist/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/camera@5.0.0/dist/web.js"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              darkbase: "#06080f",
              panel: "#0e1320",
              panelborder: "#1a233a",
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #06080f;
        color: #cbd5e1;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(3, 5, 10, 0.95);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .lightbox.active {
        display: flex;
        opacity: 1;
      }
      .lightbox img {
        max-width: 92%;
        max-height: 92vh;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        border: 1px solid #1e293b;
      }
    </style>

    <link rel="manifest" href="./manifest.json" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <meta name="theme-color" content="#06080f" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="h-screen flex flex-col overflow-hidden">
    <!-- TOPO / HEADER -->
    <header
      class="bg-panel border-b border-panelborder px-5 py-3 flex items-center justify-between flex-shrink-0 z-20"
    >
      <div class="flex items-center gap-3">
        <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></div>
        <h1
          class="font-bold text-xs uppercase tracking-widest text-slate-200 mono"
        >
          OS Fácil <span class="text-blue-400 font-normal">//</span> Controle de
          Reformas
        </h1>
      </div>
      <div class="flex items-center gap-4">
        <div
          class="hidden md:flex items-center gap-3 text-xs mono text-slate-400"
        >
          <span
            >Total: <strong id="statTotal" class="text-white">0</strong></span
          >
          <span>•</span>
          <span
            >Produção:
            <strong id="statProducao" class="text-amber-400">0</strong></span
          >
          <span>•</span>
          <span
            >Prontas:
            <strong id="statProntas" class="text-blue-400">0</strong></span
          >
          <span>•</span>
          <span
            >Retiradas:
            <strong id="statRetiradas" class="text-emerald-400">0</strong></span
          >
        </div>
        <button
          onclick="window.location.href = 'index.html'"
          class="text-xs mono bg-panelborder hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded transition border border-slate-800 flex items-center gap-1.5"
        >
          <i class="fa-solid fa-arrow-left text-blue-400"></i> Painel Geral
        </button>
      </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main
      class="flex-1 flex flex-col overflow-hidden p-4 gap-3 max-w-[1600px] w-full mx-auto"
    >
      <!-- BARRA DE FILTROS E BUSCA -->
      <div
        class="bg-panel p-3 rounded border border-panelborder flex flex-col sm:flex-row items-center justify-between gap-3 flex-shrink-0"
      >
        <div
          class="flex items-center gap-2 w-full sm:w-80 bg-darkbase px-3 py-1.5 rounded border border-panelborder focus-within:border-blue-500 transition"
        >
          <i class="fa-solid fa-magnifying-glass text-slate-500 text-xs"></i>
          <input
            id="inputBusca"
            type="text"
            placeholder="Filtrar por OS, cliente ou cor..."
            class="w-full bg-transparent border-none outline-none text-xs text-white placeholder:text-slate-600 mono"
          />
        </div>

        <div
          class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0"
        >
          <button
            onclick="definirFiltro('todas')"
            id="btnFiltroTodas"
            class="px-3 py-1.5 text-xs mono font-semibold rounded bg-blue-600 text-white transition"
          >
            Todas
          </button>
          <button
            onclick="definirFiltro('producao')"
            id="btnFiltroProducao"
            class="px-3 py-1.5 text-xs mono font-semibold rounded bg-darkbase hover:bg-slate-800 text-slate-400 border border-panelborder transition"
          >
            Em Produção
          </button>
          <button
            onclick="definirFiltro('prontas')"
            id="btnFiltroProntas"
            class="px-3 py-1.5 text-xs mono font-semibold rounded bg-darkbase hover:bg-slate-800 text-slate-400 border border-panelborder transition"
          >
            Prontas
          </button>
          <button
            onclick="definirFiltro('retiradas')"
            id="btnFiltroRetiradas"
            class="px-3 py-1.5 text-xs mono font-semibold rounded bg-darkbase hover:bg-slate-800 text-slate-400 border border-panelborder transition"
          >
            Retiradas
          </button>
        </div>
      </div>

      <!-- TABELA / LISTA DE REFORMAS -->
      <div
        class="flex-1 bg-panel rounded border border-panelborder overflow-y-auto relative"
      >
        <table class="w-full text-left border-collapse">
          <thead
            class="bg-darkbase sticky top-0 z-10 border-b border-panelborder text-[11px] mono text-slate-400 uppercase tracking-wider"
          >
            <tr>
              <th class="p-3 w-52 text-center">Foto Grande (Destaque)</th>
              <th class="p-3 w-24">OS Nº</th>
              <th class="p-3">Cliente</th>
              <th class="p-3 w-40">Acabamento / Cor</th>
              <th class="p-3 w-32 text-center">Status</th>
              <th class="p-3 w-28 text-center">Data</th>
              <th class="p-3 w-44 text-right">Ações</th>
            </tr>
          </thead>
          <tbody
            id="listaReformas"
            class="divide-y divide-panelborder/50 text-xs"
          >
            <tr>
              <td colspan="7" class="py-16 text-center text-slate-500 mono">
                <i
                  class="fa-solid fa-circle-notch fa-spin text-xl text-blue-500 mb-2 block"
                ></i>
                Carregando registros do servidor...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="lightbox" onclick="fecharLightbox(event)">
      <button
        onclick="fecharLightbox(event)"
        class="absolute top-5 right-5 w-9 h-9 bg-panel border border-panelborder text-slate-300 rounded flex items-center justify-center hover:bg-slate-800 transition"
      >
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
      <button
        onclick="navegarLightbox(event, -1)"
        id="btnPrev"
        class="absolute left-5 top-1/2 -translate-y-1/2 w-10 h-10 bg-panel border border-panelborder text-slate-300 rounded flex items-center justify-center hover:bg-slate-800 transition"
      >
        <i class="fa-solid fa-chevron-left text-sm"></i>
      </button>
      <img
        id="lightboxImg"
        src=""
        alt="Ampliação"
        onclick="event.stopPropagation()"
      />
      <button
        onclick="navegarLightbox(event, 1)"
        id="btnNext"
        class="absolute right-5 top-1/2 -translate-y-1/2 w-10 h-10 bg-panel border border-panelborder text-slate-300 rounded flex items-center justify-center hover:bg-slate-800 transition"
      >
        <i class="fa-solid fa-chevron-right text-sm"></i>
      </button>
      <div
        id="lightboxCounter"
        class="absolute bottom-5 left-1/2 -translate-x-1/2 text-slate-300 mono bg-panel border border-panelborder px-3.5 py-1 rounded text-xs"
      >
        1 / 1
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/reforma.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
